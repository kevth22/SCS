<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrieren | Black White Eagles</title>
  <link rel="stylesheet" href="style.css?v=9">
  <link rel="stylesheet" href="konto.css?v=9">
</head>
<body>
<header class="app-header">
  <img src="black-white-eagles-logo.png?v=9" class="logo" alt="Black White Eagles Logo">
  <h1>Gastkonto erstellen</h1>
  <p>Eine E-Mail-Adresse ist nicht erforderlich</p>
</header>

<main class="app-container konto-container">
  <section class="info-card konto-card">
    <h2>👤 Registrierung</h2>

    <label for="firstName">Vorname</label>
    <input id="firstName" type="text" autocomplete="given-name" maxlength="50">

    <label for="lastName">Nachname</label>
    <input id="lastName" type="text" autocomplete="family-name" maxlength="50">

    <label for="username">Nickname / Benutzername</label>
    <input id="username" type="text" autocomplete="username" maxlength="30">
    <small>Erlaubt: Buchstaben, Zahlen, Punkt, Unterstrich und Bindestrich.</small>

    <label for="password">Passwort</label>
    <input id="password" type="password" autocomplete="new-password" maxlength="100">

    <label for="passwordRepeat">Passwort wiederholen</label>
    <input id="passwordRepeat" type="password" autocomplete="new-password" maxlength="100">

    <div class="honeypot" aria-hidden="true">
      <label for="website">Website</label>
      <input id="website" type="text" tabindex="-1" autocomplete="off">
    </div>

    <label class="konto-check">
      <input id="privacyAccepted" type="checkbox">
      <span>
        Ich habe die
        <a href="datenschutz.html" target="_blank" rel="noopener">Datenschutzerklärung</a>
        gelesen und stimme der Speicherung meiner Daten bei Firebase zu.
      </span>
    </label>

    <button id="registerButton" type="button">Gastkonto erstellen</button>
    <a class="konto-link-button" href="login.html">Zurück zum Login</a>

    <p class="konto-hinweis">
      Neue Konten erhalten automatisch die Rolle „Gast“ und keine Spieltagsbenachrichtigungen.
    </p>
    <p id="registerMessage" class="konto-meldung" hidden></p>
  </section>
</main>

<script type="module" src="registrieren.js"></script>
<script type="module" src="push-foreground.js?v=10.0.1"></script>
</body>
</html>
